# Render blueprint for the FastAPI backend.
# Vercel hosts the Next.js app, Cloudflare hosts the chat Worker, and this
# hosts the API. Three services, three platforms.
services:
  - type: web
    name: flexx-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # $PORT is assigned by Render; binding 0.0.0.0 (not 127.0.0.1) is what
    # makes the service reachable from outside its container.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Paste the Neon connection string, rewritten to the SQLAlchemy form:
      #   postgresql+psycopg://USER:PASSWORD@HOST/DBNAME?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Your Vercel domain. Without it the browser blocks every API call.
      - key: CORS_ORIGINS
        sync: false
      # Generated by Render and never shown in the repo.
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: DEBUG
        value: "false"
